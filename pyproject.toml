[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-explainer-agent"
version = "0.1.0"
description = "Autonomous agent that explains a GitHub codebase using RAG + local LLM."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "agent", "ingest", "rag", "scripts"]
